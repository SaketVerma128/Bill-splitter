<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bill Splitter Pro</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;font-family:Segoe UI,Arial;background:linear-gradient(135deg,#0f172a,#1e293b);color:#e2e8f0}.card{width:100%;max-width:460px;background:#0f172af2;border:1px solid #94a3b833;border-radius:24px;padding:30px;box-shadow:0 25px 60px #00000059}.header{text-align:center;margin-bottom:26px}.icon{width:58px;height:58px;margin:auto auto 12px;border-radius:18px;display:grid;place-items:center;background:#22c55e;color:white;font-size:28px;font-weight:bold}h1{margin:0;font-size:28px}.subtitle{margin:7px 0;color:#94a3b8;font-size:14px}.field{margin-bottom:16px}label{display:block;margin-bottom:7px;font-size:14px;font-weight:600}input{width:100%;padding:13px 15px;border-radius:12px;border:1px solid #334155;background:#0f172a;color:white;font-size:16px;outline:0}input:focus{border-color:#22c55e;box-shadow:0 0 0 3px #22c55e1f}button{width:100%;margin-top:8px;padding:14px;border:0;border-radius:12px;background:#22c55e;color:white;font-size:16px;font-weight:700;cursor:pointer}.save{background:#2563eb;display:none}.history{background:#475569}.results{margin-top:24px;display:grid;gap:12px}.result,.history-item{padding:16px;border-radius:14px;background:#1e293b;border:1px solid #334155}.result-title{color:#94a3b8;font-size:13px;margin-bottom:5px}.result-main{font-size:20px;font-weight:700}.result-main span,.history-row strong{color:#22c55e}.error{margin-top:15px;padding:11px;border-radius:10px;background:#ef44441f;color:#fca5a5;display:none}.back{width:auto;margin:0;background:#475569;padding:9px 14px}.history-head{display:flex;align-items:center;gap:12px;margin-bottom:20px}.history-head h1{flex:1}.history-list{display:grid;gap:12px;max-height:60vh;overflow:auto}.history-date{font-size:12px;color:#94a3b8;margin-bottom:10px}.history-row{display:flex;justify-content:space-between;gap:10px;margin:6px 0;font-size:14px}.delete{width:auto;margin:10px 0 0;padding:7px 11px;background:#7f1d1d;font-size:12px}.clear{background:#7f1d1d}.empty{text-align:center;color:#94a3b8;padding:30px 10px}@media(max-width:480px){.card{padding:22px}h1{font-size:24px}}
</style></head><body>
<div class="card" id="calc"><div class="header"><div class="icon">₹</div><h1>Bill Splitter Pro</h1><p class="subtitle">Split your electricity bill by meter usage</p></div><div class="field"><label>Total Bill (₹)</label><input id="amount" type="number" step="any" placeholder="e.g. 2500"></div><div class="field"><label>Total Units</label><input id="units" type="number" step="any" placeholder="e.g. 500"></div><div class="field"><label>Submeter Units</label><input id="sub" type="number" step="any" placeholder="e.g. 180"></div><button onclick="calculate()">Calculate Split</button><button class="save" id="save" onclick="saveResult()">Save Result to History</button><button class="history" onclick="showHistory()">View History</button><div id="error" class="error"></div><div class="results"><div class="result"><div class="result-title">Harish Bhaiya</div><div id="harish" class="result-main">—</div></div><div class="result"><div class="result-title">Nilkanth Uncle</div><div id="nilkanth" class="result-main">—</div></div></div></div>
<div class="card" id="hist" style="display:none"><div class="history-head"><button class="back" onclick="showCalc()">← Back</button><h1>Bill History</h1></div><div id="list" class="history-list"></div><button class="clear" onclick="clearHistory()">Clear All History</button></div>
<script>let current=null;function calculate(){let a=parseFloat(amount.value),u=parseFloat(units.value),s=parseFloat(sub.value);error.style.display='none';if([a,u,s].some(Number.isNaN))return showError('Please enter numeric values only!');if(u===0)return showError('Total units cannot be zero!');let sp=Math.round(a*s/u),hp=Math.trunc(a-sp),hu=u-s;harish.innerHTML='<span>₹'+hp+'</span> &nbsp;•&nbsp; '+hu+' units';nilkanth.innerHTML='<span>₹'+sp+'</span> &nbsp;•&nbsp; '+s+' units';current={a,u,s,sp,hp,hu,date:new Date().toLocaleString()};save.style.display='block'}function showError(x){error.textContent=x;error.style.display='block'}function saveResult(){if(!current)return;let h=JSON.parse(localStorage.getItem('billHistory')||'[]');h.unshift(current);localStorage.setItem('billHistory',JSON.stringify(h));save.textContent='✓ Saved to History';setTimeout(()=>save.textContent='Save Result to History',1500)}function showHistory(){calc.style.display='none';hist.style.display='block';render()}function showCalc(){hist.style.display='none';calc.style.display='block'}function render(){let h=JSON.parse(localStorage.getItem('billHistory')||'[]');list.innerHTML=h.length?h.map((x,i)=>`<div class="history-item"><div class="history-date">${x.date}</div><div class="history-row"><span>Total Bill</span><strong>₹${x.a}</strong></div><div class="history-row"><span>Total Units</span><strong>${x.u}</strong></div><div class="history-row"><span>Harish Bhaiya</span><strong>₹${x.hp} (${x.hu} units)</strong></div><div class="history-row"><span>Nilkanth Uncle</span><strong>₹${x.sp} (${x.s} units)</strong></div><button class="delete" onclick="del(${i})">Delete</button></div>`).join(''):'<div class="empty">No saved bill history yet.</div>'}function del(i){let h=JSON.parse(localStorage.getItem('billHistory')||'[]');h.splice(i,1);localStorage.setItem('billHistory',JSON.stringify(h));render()}function clearHistory(){if(confirm('Are you sure you want to delete all saved bill history?')){localStorage.removeItem('billHistory');render()}}</script></body></html>
